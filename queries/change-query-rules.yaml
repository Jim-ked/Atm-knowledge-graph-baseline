# 左侧键必须是 API GraphDTO 节点或 Viewer 详情中实际看到的 GraphNodeDTO.kind，例如 RouteSegment；
# 它不是 config/sources.yaml 的 table、sourceId 或 sourceObject。右侧每个 queryId 必须先存在于
# queries/query-templates.yaml。一个 kind 需要多个查询时继续增加 “- queryId” 行。
associations:
  Airport:
    - airport-direct-flights
  RouteSegment:
    - segment-route-structures
  PlannedFlightRoute:
    - planned-route-flights

# 假设以后 GraphDTO 实际出现 kind=NavPoint，且 query-templates.yaml 已定义两个 queryId，写法是：
#   NavPoint:
#     - navpoint-neighbors
#     - navpoint-routes
#
# 修改后执行：
# mvn.cmd -Dtest=ChangeQueryRuleRegistryTest,GraphChangeAssociationProjectorTest,KgServiceMainTest test
#
# 正式 KgServiceMain 会加载本文件；UPSERT 写图成功后执行 Neighborhood + Association，并只输出
# 一行控制台摘要。该输出不是 durable sink。DELETE Projector 仍跳过，tools\sync.cmd 不走 GraphChange。
