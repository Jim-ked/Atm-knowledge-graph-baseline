# 正式接入第一个数据源时，把 sources: [] 替换为下面某个示例；已有 source 时在数组下追加完整
# “- sourceId”块。sourceId 和 objects 下的键必须逐字复制到 mapping/字段映射.xlsx。
# 修改 Excel 后先执行：
# tools\source-preview.cmd config\sources.yaml <sourceId> <sourceObject> 5
# 确认 SourceRecord 后再改 mapping，最后执行 tools\sync.cmd。这里不填写本体 IRI、UID规则或密码。
sources: []

# 正式数据源接入后人工填写。这里仅描述“物理上去哪里读、怎样形成 SourceRecord”，
# 具体航空字段、本体类、属性和关系语义仍由 mapping/字段映射.xlsx 维护。
#
# Excel 示例（当前仍是注释，不会被运行时读取）。接入时取消整个 source 块的注释：
# sources:
#   - sourceId: excel-main        # 自定义稳定标识；mapping 的 sourceId 列写 excel-main
#     adapter: excel              # 固定写 excel
#     root: data/excel            # 相对项目根目录；files 从这里匹配
#     objects:
#       airspace-base:             # sourceObject；mapping 的“源对象/源记录类型”写这个键
#         files: "空域*.xlsx"      # 同结构文件一次匹配多个，不为每个文件复制配置
#         sheet: 1                 # 从 1 开始的序号；也可直接写 Sheet 名“空域主表”
#         headerRow: 1             # 从 1 开始的表头行
#         keyFields: ["空域ID"]    # 表头字段；按顺序组成 SourceRecord.sourceKey
#         recordMode: row          # 每个有效行生成一条记录
#       airspace-boundary:
#         files: "空域*.xlsx"
#         sheet: 2
#         headerRow: 1
#         keyFields: ["空域ID", "序号"]
#         recordMode: row
#       scheduled-route-segment:
#         files: "班机航线*.xlsx"
#         sheet: 1
#         headerRow: 1
#         keyFields: ["航线ID", "序号"]
#         recordMode: adjacent_next # 同组当前行+下一行；组末行不生成
#         groupBy: ["航线ID"]       # 先按这些表头字段分组
#         orderBy: "序号"           # 组内排序字段；重复顺序值会失败
#
# ADJACENT_NEXT 会把当前行字段保留在顶层，同时提供 current.<字段> 与 next.<字段>；
# 最后一行没有 next 时不产生记录。Adapter 还会加入 __sourceKey 供确需复合业务键的映射使用。
#
# Oracle JDBC 示例（当前仍是注释）。Adapter 仍是通用 jdbc；新增表时通常只在同一个 jdbc-main
# 的 objects 下追加 object，不要为同一数据库每张表复制 driver/url/账号环境变量：
# sources:
#   - sourceId: jdbc-main             # 稳定技术标识；不要写 oracle；mapping 写同一值
#     adapter: jdbc                   # 固定写 jdbc
#     driver: oracle.jdbc.OracleDriver
#     url: jdbc:oracle:thin:@//DB_HOST:1521/SERVICE_NAME
#     usernameEnv: ATMKG_JDBC_USERNAME # 值是环境变量名，不是用户名
#     passwordEnv: ATMKG_JDBC_PASSWORD # 值是环境变量名，不是密码
#     fetchSize: 500                  # 可选，默认 500
#     objects:
#       example-object:                # sourceObject；mapping 和 polling scope 引用这个键
#         table: SCHEMA.TABLE_NAME     # 与 view 二选一；视图改写为 view: SCHEMA.VIEW_NAME
#         keyFields: [ID]              # 与 ResultSet columnLabel 一致的稳定非空唯一业务键
#         watermarkField: UPDATED_AT   # 可选 DATE/TIMESTAMP 列；配置后才可增量扫描/polling
#
# JDBC 只允许读取受控配置中的简单表/视图和字段标识符，不接受运行时 SQL。
# 密码只通过 passwordEnv 指向的环境变量提供，不进入 YAML。mapping 的 sourceId/sourceObject
# 必须与这里逐字一致。以后更换其他 JDBC 数据库时，原则上只替换 runtime driver、URL 和源对象配置，
# 不要求修改 Core 或把数据库厂商判断加入业务边界。
# CSV / JSON 后续仍沿用同一 sourceId + objectName + sourceKey 边界；
# 不在 Java Core 中加入任何数据库厂商或航空字段判断。
