# 本文件是给人看的项目/路径索引，当前没有 Java 类加载它。下面值必须与当前代码事实保持一致；
# 只改这里不会改变 service.cmd 行为。
project:
  id: atm-knowledge-graph            # KgServiceMain/SyncControlMain 当前直接传入这个固定 projectId
  name: 航管知识图谱                   # 显示名称，不驱动运行时
  namespace: "urn:atm-knowledge-graph:" # SyncRuntimeAssembler 当前使用固定身份 namespace

paths:
  ontologyConfig: config/ontology.yaml # 当前服务实际直接加载 ontology/atm_knowledge_graph.ttl
  sourceConfig: config/sources.yaml     # SyncRuntimeAssembler 中固定路径
  neo4jConfig: config/neo4j.yaml        # 当前服务不加载，连接来自固定 ATMKG_NEO4J_* 名称
  syncConfig: config/sync.yaml          # SyncRuntimeAssembler 中固定路径
  queryConfig: config/query.yaml        # 当前服务不加载
  apiConfig: config/api.yaml            # KgServiceMain 中固定路径
  mapping: mapping/字段映射.xlsx         # 同步装配中固定路径
  queries: queries                      # 实际固定加载 queries/query-templates.yaml
  fixtures: fixtures                    # 开发生成/测试目录，不进入正式 source

# 如果确实要迁移 project.id、namespace 或路径，不能复制/改一个值后运行；先搜索
# KgServiceMain、SyncRuntimeAssembler、SyncControlMain、DeterministicIdentityResolver 的固定值并设计 UID 迁移。
