# 这里记录本体基线，当前 KgServiceMain/SyncControlMain 不加载本文件，而是直接打开
# ontology/atm_knowledge_graph.ttl。不要把 file 改成另一份 TTL 期待 service.cmd 自动切换。
ontology:
  file: ontology/atm_knowledge_graph.ttl # 唯一正式本体；历史由 Git 保存
  strictValidation: true                 # 当前是声明；实际严格校验由 Jena/PoiMappingRegistry 代码执行

mappingRefresh:
  preserveExisting: true       # 当前是 refresh 规则说明；Phase1CheckMain --refresh 不读取该值
  newTermMarker: "[待映射]"    # 新术语追加标记，不表示该 mapping 已可执行

# 修改本体要直接编辑 ontology/atm_knowledge_graph.ttl，再补 mapping/字段映射.xlsx 三张 Sheet，
# 执行 mvn.cmd test，然后先用 tools\sync.cmd resync 一条并用 tools\review.cmd 检查。
